[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "market_agents"
version = "0.1.0"
description = "AI agents for geopolitical event impact analysis and market signal generation"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "networkx",
    "requests",
    "yfinance>=0.2.0",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["venv"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[project.optional-dependencies]
dev = ["fastapi", "uvicorn[standard]"]

[pytest]
pythonpath =
    .

testpaths =
    tests

log_cli = true
log_cli_level = INFO

addopts =
    -v
    --tb=short
    --strict-markers

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    neo4j: tests requiring a Neo4j connection
    integration: tests that hit external APIs
